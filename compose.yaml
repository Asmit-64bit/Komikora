name: consentcraft

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:setup first}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run env:setup first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    image: chrislusf/seaweedfs:4.52
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run npm run env:setup first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run npm run env:setup first}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - media-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  media-data:
